<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Desiree Gwyn Daga</title>
<meta name="description" content="Desiree Gwyn Daga, Licensed Professional Teacher from the Philippines, cum laude education graduate (major in English), available for playschool, nursery and kindergarten roles across Asia-Pacific.">
<meta property="og:title" content="Teacher Desiree Gwyn Daga · Licensed Professional Teacher">
<meta property="og:description" content="Cum laude English education graduate and Licensed Professional Teacher, ready to teach playschool across Asia-Pacific.">
<meta property="og:image" content="images/desiree-daga.jpg">
<meta name="theme-color" content="#ff6b6b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#fffaf2; --ink:#1d1b3a; --body:#4a4766; --muted:#7a7794; --line:#efe7da;
    --coral:#ff6b6b; --coral-soft:#ffe3e3;
    --sun:#ffc83d; --sun-soft:#fff3d1;
    --teal:#20c3b0; --teal-soft:#d9f7f2;
    --grape:#7b5cff; --grape-soft:#ebe5ff;
    --sky:#47b8f5; --sky-soft:#def2fd;
    --leaf:#7ccf5b;
    --radius:24px;
    --shadow:0 18px 40px -18px rgba(29,27,58,.28);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-behavior:smooth;overflow-x:clip;}
  .hero,.where{overflow-x:clip;}
  body{margin:0;background:var(--cream);color:var(--body);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.65;overflow-x:hidden;}
  h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;color:var(--ink);line-height:1.1;margin:0;letter-spacing:-.01em;}
  p{margin:0;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px;}
  :focus-visible{outline:3px solid var(--grape);outline-offset:3px;border-radius:8px;}

  /* ---------- nav ---------- */
  header{position:sticky;top:0;z-index:40;background:rgba(255,250,242,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s;}
  header.scrolled{border-bottom-color:var(--line);}
  .nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:var(--ink);}
  .brand .mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--coral),var(--sun),var(--teal),var(--grape),var(--coral));color:#fff;font-size:18px;box-shadow:0 6px 14px -6px rgba(255,107,107,.7);}
  .brand .mark span{background:var(--ink);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;}
  .links{display:flex;gap:26px;list-style:none;margin:0;padding:0;}
  .links a{text-decoration:none;font-weight:700;font-size:15px;color:var(--body);}
  .links a:hover{color:var(--coral);}
  .lang{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;}
  .lang svg{width:18px;height:18px;flex:none;color:var(--grape);}
  .lang select{font:inherit;font-weight:700;font-size:14px;border:0;background:transparent;color:var(--ink);padding:6px 4px;cursor:pointer;max-width:150px;}
  .lang select:focus{outline:none;}
  .lang:focus-within{border-color:var(--grape);}

  /* ---------- hero ---------- */
  .hero{position:relative;padding:56px 0 90px;}
  .hero::before{content:"";position:absolute;inset:-120px -10% auto auto;width:620px;height:620px;background:radial-gradient(circle at 30% 30%,var(--sun-soft),transparent 60%);z-index:-1;}
  .hero::after{content:"";position:absolute;left:-180px;top:180px;width:520px;height:520px;background:radial-gradient(circle,var(--sky-soft),transparent 62%);z-index:-1;}
  .hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;}
  .pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);padding:6px 14px 6px 8px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink);}
  .pill i{width:22px;height:22px;border-radius:50%;background:var(--teal);display:grid;place-items:center;}
  .pill i::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{50%{transform:scale(.55);opacity:.6;}}
  .kicker{margin-top:22px;font-weight:800;color:var(--coral);letter-spacing:.04em;text-transform:uppercase;font-size:14px;}
  .meet{font-family:'Baloo 2',sans-serif;font-size:26px;font-weight:600;color:var(--muted);margin-top:6px;}
  h1.name{font-size:clamp(46px,7vw,84px);font-weight:800;margin-top:2px;}
  h1.name .hl{background:linear-gradient(100deg,var(--coral),var(--grape) 60%,var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .squiggle{display:block;width:220px;height:18px;margin:6px 0 0;}
  .lead{font-size:19px;max-width:560px;margin-top:18px;}
  .badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;}
  .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;font-weight:800;font-size:14px;}
  .badge svg{width:18px;height:18px;}
  .b1{background:var(--teal-soft);color:#0d8a7c;} .b2{background:var(--sun-soft);color:#a86c00;} .b3{background:var(--grape-soft);color:var(--grape);}
  .ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px;}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;font-weight:800;font-size:16px;text-decoration:none;border:0;cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .btn svg{width:18px;height:18px;}
  .btn-main{background:var(--coral);color:#fff;box-shadow:0 12px 24px -10px rgba(255,107,107,.9);}
  .btn-main:hover{transform:translateY(-2px) rotate(-1deg);}
  .btn-ghost{background:#fff;color:var(--ink);border:2px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);}

  .portrait{position:relative;justify-self:center;width:min(420px,100%);}
  .frame{position:relative;aspect-ratio:3/4;border-radius:46% 54% 42% 58% / 38% 40% 60% 62%;overflow:hidden;background:linear-gradient(160deg,var(--sky-soft),var(--grape-soft));box-shadow:var(--shadow);border:8px solid #fff;outline:4px dashed var(--sun);outline-offset:10px;animation:morph 14s ease-in-out infinite;}
  @keyframes morph{50%{border-radius:56% 44% 54% 46% / 46% 52% 48% 54%;}}
  .frame img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;}
  .frame .ph{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--grape);font-weight:800;text-align:center;}
  .frame .ph svg{width:72px;height:72px;}
  .frame.empty img{display:none;} .frame.empty .ph{display:flex;}
  .bubble{position:absolute;left:-26px;top:34px;background:#fff;padding:10px 18px;border-radius:20px 20px 20px 6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;color:var(--coral);box-shadow:var(--shadow);transform:rotate(-6deg);animation:bob 4s ease-in-out infinite;}
  .sticker{position:absolute;filter:drop-shadow(0 10px 14px rgba(29,27,58,.18));}
  .s-blocks{right:-34px;bottom:56px;width:120px;animation:bob 5s ease-in-out infinite reverse;}
  .s-star{right:6px;top:-18px;width:66px;animation:spin 12s linear infinite;}
  .s-crayon{left:-40px;bottom:10px;width:120px;transform:rotate(-24deg);}
  .medal{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px;white-space:nowrap;box-shadow:var(--shadow);}
  .medal svg{width:22px;height:22px;color:var(--sun);}
  @keyframes bob{50%{transform:translateY(-10px) rotate(-6deg);}}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-30px;position:relative;z-index:2;}
  .stat{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);border-top:6px solid var(--c);}
  .stat b{display:block;font-family:'Baloo 2',sans-serif;font-size:26px;color:var(--ink);line-height:1.1;}
  .stat span{font-size:14.5px;color:var(--muted);font-weight:600;}

  /* ---------- sections ---------- */
  section{padding:90px 0;}
  .eyebrow{display:inline-block;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--grape));background:var(--cs,var(--grape-soft));padding:6px 12px;border-radius:999px;margin-bottom:14px;}
  h2{font-size:clamp(32px,4.4vw,48px);font-weight:800;}
  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;}
  .about-text p{margin-top:16px;font-size:18px;}
  .about-art{background:var(--sky-soft);border-radius:36px;padding:26px;position:relative;}
  .about-art svg{width:100%;height:auto;display:block;}

  .skills{background:#fff;border-radius:48px;margin:0 12px;}
  .skills-head{text-align:center;max-width:720px;margin:0 auto 46px;}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .card{background:var(--bg);border-radius:var(--radius);padding:26px;transition:transform .2s;}
  .card:hover{transform:translateY(-6px) rotate(-.6deg);}
  .card .ic{width:58px;height:58px;border-radius:18px;background:#fff;display:grid;place-items:center;margin-bottom:16px;box-shadow:0 8px 16px -10px rgba(29,27,58,.35);}
  .card .ic svg{width:30px;height:30px;}
  .card h3{font-size:22px;margin-bottom:6px;}
  .card p{font-size:15.5px;}

  /* playground banner */
  .play{padding:70px 0 40px;}
  .scene{position:relative;border-radius:40px;overflow:hidden;background:linear-gradient(180deg,#bfe9ff,#e9f8ff 60%);box-shadow:var(--shadow);}
  .scene svg{display:block;width:100%;height:auto;}
  .scene .quote{position:absolute;left:0;right:0;top:34px;text-align:center;padding:0 24px;font-family:'Baloo 2',sans-serif;font-weight:800;color:var(--ink);font-size:clamp(22px,3.4vw,38px);line-height:1.15;}
  .scene .quote span{background:rgba(255,255,255,.75);padding:4px 16px;border-radius:16px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}

  /* credentials */
  .creds-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start;}
  .timeline{position:relative;display:grid;gap:18px;}
  .timeline::before{content:"";position:absolute;left:28px;top:20px;bottom:20px;border-left:4px dotted var(--line);}
  .tl{position:relative;display:flex;gap:18px;align-items:flex-start;background:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 10px 26px -18px rgba(29,27,58,.4);}
  .tl .dot{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--c);margin-left:-2px;}
  .tl .dot svg{width:28px;height:28px;}
  .tl h3{font-size:21px;}
  .tl p{font-size:15.5px;color:var(--muted);font-weight:600;}

  /* where */
  .where{background:linear-gradient(135deg,var(--grape),#5b3fe0 60%,var(--sky));color:#fff;border-radius:48px;margin:0 12px;position:relative;overflow:hidden;}
  .where h2{color:#fff;}
  .where p.sub{opacity:.9;font-size:18px;margin-top:10px;max-width:640px;}
  .where .eyebrow{background:rgba(255,255,255,.18);color:#fff;}
  .chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px;}
  .chip{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.28);padding:10px 18px;border-radius:999px;font-weight:800;font-size:15.5px;display:inline-flex;align-items:center;gap:8px;}
  .chip i{width:10px;height:10px;border-radius:50%;background:var(--sun);}
  .chip.home{background:var(--sun);color:var(--ink);border-color:var(--sun);}
  .chip.home i{background:var(--coral);}
  .where .globe{position:absolute;right:-90px;bottom:-110px;width:380px;opacity:.18;}

  /* contact */
  .contact{text-align:center;}
  .contact-card{background:#fff;border-radius:40px;padding:56px 28px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .contact-card p{max-width:560px;margin:12px auto 0;font-size:18px;}
  .contact-card .ctas{justify-content:center;}
  .soon{margin-top:22px;font-weight:700;color:var(--muted);}
  .confetti{position:absolute;inset:0;pointer-events:none;}
  footer{padding:30px 0 50px;text-align:center;color:var(--muted);font-size:14px;font-weight:600;}

  /* reveal */
  .rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease;}
  .rv.in{opacity:1;transform:none;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;}
    .rv{opacity:1;transform:none;transition:none;}
  }

  @media (max-width:980px){
    .hero-grid,.about-grid,.creds-grid{grid-template-columns:1fr;}
    .portrait{margin-top:20px;}
    .cards{grid-template-columns:1fr 1fr;}
    .stats{grid-template-columns:1fr 1fr;margin-top:10px;}
    .links{display:none;}
  }
  @media (max-width:620px){
    body{font-size:16px;}
    .cards,.stats{grid-template-columns:1fr;}
    .hero{padding-top:36px;}
    .s-blocks{right:-6px;width:90px;}
    .s-crayon{left:-10px;width:90px;}
    .bubble{left:-4px;font-size:18px;}
    section{padding:64px 0;}
    .skills,.where{margin:0;border-radius:32px;}
    .brand .txt{display:none;}
  }
</style>
</head>
<body>

<!-- reusable icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></symbol>

</svg>

<header id="top">
  <div class="wrap nav">
    <a class="brand" href="#top"><span class="mark"><span>D</span></span><span class="txt">Teacher Desiree</span></a>
    <ul class="links">
      <li><a href="#about" data-i18n="nav_about"></a></li>
      <li><a href="#teaching" data-i18n="nav_skills"></a></li>
      <li><a href="#credentials" data-i18n="nav_creds"></a></li>
      <li><a href="#where" data-i18n="nav_where"></a></li>
      <li><a href="#contact" data-i18n="nav_contact"></a></li>
    </ul>
    <label class="lang">
      <svg><use href="#i-globe"/></svg>
      <span class="sr" style="position:absolute;left:-9999px" data-i18n="lang"></span>
      <select id="langSel"></select>
    </label>
  </div>
</header>

<main>
  <!-- HERO -->
  <div class="hero">
    <div class="wrap hero-grid">
      <div>
        <span class="pill"><i></i><span data-i18n="open"></span></span>
        <div class="kicker" data-i18n="kicker"></div>
        <div class="meet" data-i18n="meet"></div>
        <h1 class="name">Desiree <span class="hl">Gwyn Daga</span></h1>
        <svg class="squiggle" viewBox="0 0 220 18" aria-hidden="true"><path d="M2 10 C 20 0, 36 18, 54 9 S 90 0, 108 9 S 144 18, 162 9 S 198 0, 218 9" fill="none" stroke="#ffc83d" stroke-width="5" stroke-linecap="round"/></svg>
        <p class="lead" data-i18n="lead"></p>
        <div class="badges">
          <span class="badge b1"><svg><use href="#i-cert"/></svg><span data-i18n="badge_lpt"></span></span>
          <span class="badge b2"><svg><use href="#i-star"/></svg><span data-i18n="badge_cl"></span></span>
          <span class="badge b3"><svg><use href="#i-chat"/></svg><span data-i18n="badge_eng"></span></span>
        </div>
        <div class="ctas">
          <a class="btn btn-main" href="#contact"><span data-i18n="cta_hire"></span><svg><use href="#i-arrow"/></svg></a>
          <a class="btn btn-ghost" href="#about" data-i18n="cta_more"></a>
        </div>
      </div>

      <div class="portrait">
        <div class="frame" id="frame">
          <img src="images/desiree-daga.jpg" id="photo" alt="Desiree Gwyn Daga in graduation toga" onerror="document.getElementById('frame').classList.add('empty')">
          <div class="ph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg><span data-i18n="photo_add"></span></div>
        </div>
        <div class="bubble" data-i18n="hello"></div>
        <!-- ABC blocks -->
        <svg class="sticker s-blocks" viewBox="0 0 120 110" aria-hidden="true">
          <g><rect x="4" y="52" width="54" height="54" rx="8" fill="#ff6b6b"/><rect x="10" y="58" width="42" height="42" rx="5" fill="#ff8a8a"/><text x="31" y="92" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="34" fill="#fff">A</text></g>
          <g><rect x="62" y="52" width="54" height="54" rx="8" fill="#20c3b0"/><rect x="68" y="58" width="42" height="42" rx="5" fill="#4fd6c6"/><text x="89" y="92" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="34" fill="#fff">B</text></g>
          <g transform="rotate(-8 60 30)"><rect x="33" y="2" width="54" height="54" rx="8" fill="#ffc83d"/><rect x="39" y="8" width="42" height="42" rx="5" fill="#ffd970"/><text x="60" y="42" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="34" fill="#fff">C</text></g>
        </svg>
        <svg class="sticker s-star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l3.1 6.4 7 1-5.1 4.9 1.2 7L12 17.5l-6.2 3.3 1.2-7L1.9 8.9l7-1z" fill="#ffc83d" stroke="#fff" stroke-width="1.2"/></svg>
        <svg class="sticker s-crayon" viewBox="0 0 140 34" aria-hidden="true"><path d="M2 17 L24 4 H120 a8 8 0 0 1 8 8 v10 a8 8 0 0 1-8 8 H24 Z" fill="#7b5cff"/><path d="M2 17 L24 4 V30 Z" fill="#f4d9b0"/><path d="M2 17 L10 12.3 V21.7 Z" fill="#7b5cff"/><rect x="40" y="4" width="10" height="26" fill="#5b3fe0"/><rect x="96" y="4" width="10" height="26" fill="#5b3fe0"/></svg>
        <div class="medal"><svg><use href="#i-cap"/></svg><span data-i18n="medal"></span></div>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="wrap stats">
    <div class="stat rv" style="--c:var(--coral)"><b>Cum Laude</b><span data-i18n="st1"></span></div>
    <div class="stat rv" style="--c:var(--teal)"><b>LPT</b><span data-i18n="st2"></span></div>
    <div class="stat rv" style="--c:var(--sun)"><b data-i18n="st3v"></b><span data-i18n="st3"></span></div>
    <div class="stat rv" style="--c:var(--grape)"><b data-i18n="st4v"></b><span data-i18n="st4"></span></div>
  </div>

  <!-- ABOUT -->
  <section id="about">
    <div class="wrap about-grid">
      <div class="about-text rv">
        <span class="eyebrow" style="--c:#c2410c;--cs:var(--coral-soft)" data-i18n="nav_about"></span>
        <h2 data-i18n="about_h"></h2>
        <p data-i18n="about_p1"></p>
        <p data-i18n="about_p2"></p>

// ---- language handling ---------------------------------------------------------------------
const sel = document.getElementById('langSel');
sel.innerHTML = LANGS.map(([c, n]) => `<option value="${c}">${n}</option>`).join('');

function pickInitial(){
  const q = new URLSearchParams(location.search).get('lang');
  if (q && T[q]) return q;
  try { const s = localStorage.getItem('dgd-lang'); if (s && T[s]) return s; } catch(e){}
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('tl') || nav.startsWith('fil')) return 'fil';
  const base = nav.split('-')[0];
  return T[base] ? base : 'en';
}

function regionName(code, lang){
  try { return new Intl.DisplayNames([lang === 'fil' ? 'fil' : lang, 'en'], {type:'region'}).of(code); }
  catch(e){ return code; }
}

function renderContact(t){
  const box = document.getElementById('contactBtns'), soon = document.getElementById('soon');
  const b = [];
  if (CONTACT.email) b.push(`<a class="btn btn-main" href="mailto:${CONTACT.email}"><svg><use href="#i-mail"/></svg>${t.email}</a>`);
  if (CONTACT.whatsapp) b.push(`<a class="btn btn-ghost" href="https://wa.me/${CONTACT.whatsapp}" target="_blank" rel="noopener"><svg><use href="#i-chat"/></svg>${t.whatsapp}</a>`);
  if (CONTACT.phone) b.push(`<a class="btn btn-ghost" href="tel:${CONTACT.phone.replace(/\s/g,'')}"><svg><use href="#i-phone"/></svg>${t.call} ${CONTACT.phone}</a>`);
  box.innerHTML = b.join('');
  box.style.display = b.length ? '' : 'none';
  soon.style.display = b.length ? 'none' : '';
}

function setLang(lang){
  const t = T[lang] || T.en;
  document.documentElement.lang = lang === 'fil' ? 'fil' : lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.dataset.i18n; if (t[k] != null) el.textContent = t[k]; });
  document.getElementById('chips').innerHTML = REGIONS.map((r, i) =>
    `<span class="chip${i === 0 ? ' home' : ''}"><i></i>${regionName(r, lang)}</span>`).join('');
  renderContact(t);
  sel.value = lang;
  try { localStorage.setItem('dgd-lang', lang); } catch(e){}
}
sel.addEventListener('change', () => setLang(sel.value));
setLang(pickInitial());

// ---- little touches -----------------------------------------------------------------------
const header = document.querySelector('header');
addEventListener('scroll', () => header.classList.toggle('scrolled', scrollY > 8), {passive:true});
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
}), {threshold:.12}) : null;
document.querySelectorAll('.rv').forEach(el => io ? io.observe(el) : el.classList.add('in'));
</script>
